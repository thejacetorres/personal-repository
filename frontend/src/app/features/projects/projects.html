<section section id="projects" class="w-full bg-white mb-24">
  <div class="mx-auto flex max-w-[1400px] flex-col px-4 md:px-8">
    <!-- Título Principal -->
    <h2
      class="mb-12 text-center text-4xl font-black uppercase tracking-tight text-gray-900 md:text-5xl"
    >
      #JAIR EN PROJECTOS
    </h2>

    <div class="cursor-pointer grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
      @for (project of projects; track project.id) {
        <div class="aspect-square overflow-hidden bg-gray-100">
          <img
            src="{{ project.image }}"
            alt="{{ project.alt }}"
            class="h-full w-full object-cover transition-transform duration-300 hover:scale-105"
          />
        </div>
      }
    </div>
  </div>
</section>
