<!-- Contenedor del Hero: Ocupa el alto de la pantalla menos el Navbar (h-24 = 6rem) -->
<section
  id="inicio"
  class="relative flex h-175 w-full flex-col items-center justify-center overflow-hidden bg-(--color-brand-secundary) bg-contain bg-center bg-no-repeat mb-24"
  style="background-image: url('assets/photo-home.png')"
>
  <!-- Contenido central -->
  <div class="relative z-10 w-full max-w-6xl px-8 text-center">
    <h1
      class="text-7xl font-black tracking-widest text-(--color-brand-white) drop-shadow-lg md:text-9xl lg:text-[14rem] leading-none"
    >
      {{ data.author }}
    </h1>

    <hr class="mx-auto my-8 w-4/5 border-t border-white/80 md:w-full" />

    <p
      class="text-lg font-medium tracking-wide text-(--color-brand-white) drop-shadow-md md:text-xl lg:text-2xl"
    >
      {{ data.subtitle }}
    </p>
  </div>
</section>

<app-about></app-about>
<app-projects></app-projects>
<app-footer></app-footer>
