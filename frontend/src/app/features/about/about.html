<!-- Contenedor principal -->
<section id="about" class="flex min-h-175 w-full bg-(--color-brand-primary-white) mb-15">
  
  <!-- Columna de Texto: Ocupa todo el ancho (w-full) en móvil y la mitad (md:w-1/2) en pantallas grandes -->
  <div class="flex w-full flex-col justify-center px-6 py-12 sm:px-10 md:w-1/2 md:px-16 lg:px-24">
    <h2
      class="text-4xl font-black uppercase leading-tight tracking-tight text-gray-900 sm:text-5xl md:text-6xl"
    >
      Descubre<br />quién soy
    </h2>

    <div class="my-8 flex flex-col gap-6 text-sm leading-relaxed text-gray-500 md:my-10 md:pr-4 md:text-base">
      <p>
        {{ data.about.part1 }}
      </p>
      <p>
        {{ data.about.part2 }}
      </p>
    </div>

    <a
      href="/pdf/CV-JT.pdf"
      download="CV_JAIR_TORRES.pdf"
      class="w-fit bg-(--color-brand-primary) px-10 py-3 text-sm font-semibold text-(--color-brand-white) cursor-pointer"
    >
      Descargar CV
    </a>
  </div>

  <!-- Columna de Imagen: Oculta por defecto en celular (hidden) y visible solo desde tablets/escritorio (md:flex) -->
  <div
    class="relative hidden w-1/2 border-l-32 border-(--color-brand-primary) bg-(--color-brand-secundary) md:flex items-end justify-center"
  >
    <img
      src="/assets/photo-about.png"
      alt="Sobre mí"
      class="max-h-[90%] w-auto object-contain"
    />
  </div>
  
</section>
