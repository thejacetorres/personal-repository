<!-- Contenedor principal que ocupa todo el ancho disponible y al menos 700px de alto -->
<section id="about" class="flex min-h-175 w-full bg-(--color-brand-primary-white) mb-24">
  <!-- Mitad Izquierda: Contenido de Texto -->
  <div class="flex w-1/2 flex-col justify-center px-12 md:px-16 lg:px-24">
    <h2
      class="text-5xl font-black uppercase leading-tight tracking-tight text-gray-900 md:text-6xl"
    >
      Descubre<br />quién soy
    </h2>

    <div class="my-10 flex flex-col gap-6 pr-4 text-sm leading-relaxed text-gray-500 md:text-base">
      <p>
        {{ data.about.part1 }}
      </p>
      <p>
        {{ data.about.part2 }}
      </p>
    </div>

    <a
      href="/pdf/CV-JT.pdf"
      download="CV_JAIR_TORRES.pdf"
      class="w-fit bg-(--color-brand-primary) px-10 py-3 text-sm font-semibold text-(--color-brand-white) cursor-pointer"
    >
      Descargar CV
    </a>
  </div>

  <div
    class="relative w-1/2 border-l-32 border-(--color-brand-primary) bg-(--color-brand-secundary) flex items-end justify-center"
  >
    <img
      src="/assets/photo-about.png"
      alt="Sobre mí"
      class="max-h-[90%] w-auto object-contain"
    />
  </div>
</section>
